<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Cat</title>
<link rel="icon" type="image/png" href="icon.png">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #131f24; --card: #1f2f38; --border: #2b3d47;
  --green: #58cc02; --green-dark: #46a302; --red: #ff4b4b;
  --orange: #ff9600; --text: #f1f7fb; --muted: #8fa6b2;
  --gold: #ffd700; --gold-dark: #d4af00;
}
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; justify-content: center;
  padding: 16px; overflow-x: hidden;
  transition: background 0.5s ease;
}
.app { width: 100%; max-width: 480px; position: relative; }

/* ===== GATTO ===== */
.cat-stage {
  position: fixed; right: 16px; bottom: 16px;
  width: 150px; height: 150px; z-index: 100;
  pointer-events: none;
  transition: transform .4s cubic-bezier(.34,1.56,.64,1);
  animation: catIdle 3s ease-in-out infinite;
}
.cat-img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
}

/* Animazioni Gatto */
.cat-happy { animation: catJump .6s ease !important; }
.cat-sad { animation: catSad .6s ease !important; }
.cat-celebrate { animation: catCelebrate .8s ease infinite !important; }

@keyframes catJump { 0%,100%{transform:translateY(0) scale(1);} 30%{transform:translateY(-30px) scale(1.05);} 60%{transform:translateY(-10px) scale(.97);} }
@keyframes catSad { 0%,100%{transform:translateY(0) rotate(0);} 30%{transform:translateY(5px) rotate(-5deg);} 60%{transform:translateY(2px) rotate(5deg);} }
@keyframes catIdle { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
@keyframes catCelebrate { 0%,100%{transform:translateY(0) rotate(0);} 25%{transform:translateY(-20px) rotate(-10deg);} 75%{transform:translateY(-20px) rotate(10deg);} }

/* Fumetto */
.cat-bubble {
  position: fixed; right: 140px; bottom: 120px;
  max-width: 180px; background: #fff; color: #131f24;
  padding: 12px 16px; border-radius: 16px; font-size: 14px;
  font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,.4);
  opacity: 0; transform: translateY(10px) scale(.9);
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  z-index: 101; pointer-events: none; line-height: 1.3;
}
.cat-bubble::after {
  content: ""; position: absolute; bottom: -8px; right: 24px;
  width: 0; height: 0; border-left: 8px solid transparent;
  border-right: 8px solid transparent; border-top: 8px solid #fff;
}
.cat-bubble.show { opacity: 1; transform: translateY(0) scale(1); }

/* Decorazioni Sfondo */
.deco { position: fixed; z-index: 50; pointer-events: none; font-size: 40px; opacity: .85; }
.deco-top-left { top: 8px; left: 8px; }
.deco-top-right { top: 8px; right: 8px; }
.deco-bottom-left { bottom: 8px; left: 8px; }

/* ===== INTERFACCIA ===== */
header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-weight: 700; gap: 8px; }
.streak { color: var(--orange); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.streak.bump { transform: scale(1.25); }
.stats { font-size: 14px; color: var(--muted); font-weight: 400; }
.coins { color: var(--gold); font-weight: 700; font-size: 14px; }
.progress { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--green); width: 0%; transition: width .4s cubic-bezier(.22,1,.36,1); }
.card {
  background: var(--card); border-radius: 16px; padding: 24px;
  margin-top: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.3);
  animation: slideUp .35s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp { from { opacity:0; transform:translateY(16px);} to { opacity:1; transform:translateY(0);} }
@keyframes popIn { from { opacity:0; transform:scale(.92);} to { opacity:1; transform:scale(1);} }
.category { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--green); font-weight:700; margin-bottom:12px; }
.question { font-size:20px; line-height:1.4; margin-bottom:24px; animation:popIn .3s cubic-bezier(.22,1,.36,1); }
.answers { display:flex; flex-direction:column; gap:12px; }
.answer {
  background: var(--bg); border: 2px solid var(--border); border-radius: 12px;
  padding: 16px; font-size: 16px; color: var(--text); cursor: pointer;
  text-align: left; font-family: inherit;
  transition: border-color .15s, transform .15s, background .15s;
  animation: slideUp .35s cubic-bezier(.22,1,.36,1) backwards;
}
.answer:hover:not(:disabled) { border-color: var(--green); transform: translateX(4px); }
.answer:disabled { cursor: default; }
.answer.correct { border-color: var(--green); background: #1e3a1e; animation: pulseCorrect .4s ease; }
.answer.wrong { border-color: var(--red); background: #3a1e1e; animation: shake .4s ease; }
@keyframes pulseCorrect { 0%{transform:scale(1);} 40%{transform:scale(1.04);} 100%{transform:scale(1);} }
@keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
.feedback { margin-top:16px; padding:12px; border-radius:12px; font-size:14px; line-height:1.5; display:none; }
.feedback.show { display:block; animation: slideUp .3s cubic-bezier(.22,1,.36,1); }
.feedback.ok { background:#1e3a1e; color:#a5e88c; }
.feedback.no { background:#3a1e1e; color:#ffb3b3; }
.btn {
  margin-top:16px; width:100%; padding:16px; background:var(--green); color:var(--bg);
  border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer;
  font-family:inherit; transition: background .15s, transform .1s, box-shadow .15s;
  box-shadow: 0 4px 0 var(--green-dark);
}
.btn:hover { background: var(--green-dark); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-dark); }
.btn.secondary { background: transparent; color: var(--muted); border: 2px solid var(--border); box-shadow: none; }
.btn.secondary:hover { background: var(--card); color: var(--text); }
.btn.gold { background: var(--gold); color: #131f24; box-shadow: 0 4px 0 var(--gold-dark); }
.btn.gold:hover { background: var(--gold-dark); }
.btn.hidden { display: none; }
.menu-title { font-size:22px; font-weight:800; margin-top:24px; animation: slideUp .4s cubic-bezier(.22,1,.36,1); }
.menu-sub { color:var(--muted); font-size:14px; margin-top:4px; margin-bottom:8px; animation: slideUp .45s cubic-bezier(.22,1,.36,1); }
.lesson-info { display:flex; justify-content:space-between; font-size:14px; color:var(--muted); margin-bottom:16px; }
.lesson-info b { color: var(--green); }
.cat-row { display:flex; justify-content:space-between; padding:10px 0; font-size:14px; color:var(--muted); border-bottom:1px solid var(--border); }
.cat-row:last-child { border-bottom:none; }
.cat-row span:last-child { color: var(--text); font-weight:600; }
.limit-box { background: var(--card); border-radius:16px; padding:20px; margin-top:16px; text-align:center; border:2px solid var(--border); }
.limit-box h3 { font-size:18px; margin-bottom:8px; }
.limit-box p { color: var(--muted); font-size:14px; line-height:1.5; }
.done { text-align:center; padding:40px 24px; }
.done h2 { font-size:24px; margin-bottom:12px; }
.done p { color: var(--muted); margin-bottom:24px; line-height:1.5; }
.confetti { position: fixed; top: -10px; width: 8px; height: 14px; pointer-events: none; z-index: 9999; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: 0; } }

/* Shop */
.shop-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
.shop-item:last-child { border-bottom: none; }
.shop-item-info { display: flex; align-items: center; gap: 12px; flex: 1; }
.shop-item-emoji { font-size: 28px; }
.shop-item-name { font-size: 15px; font-weight: 600; }
.shop-item-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.shop-buy {
  background: var(--gold); color: #131f24; border: none; border-radius: 10px;
  padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer;
  font-family: inherit; transition: all .15s; box-shadow: 0 3px 0 var(--gold-dark);
}
.shop-buy:hover:not(:disabled) { background: var(--gold-dark); }
.shop-buy:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-dark); }
.shop-buy:disabled { background: var(--border); color: var(--muted); box-shadow: none; cursor: not-allowed; }
.shop-buy.owned { background: var(--green); color: var(--bg); box-shadow: 0 3px 0 var(--green-dark); }
.shop-buy.equipped { background: var(--green-dark); color: var(--text); box-shadow: none; cursor: default; }
.shop-section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); font-weight: 700; margin: 16px 0 8px; }
.shop-section-title:first-child { margin-top: 0; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>

  <header>
    <div style="flex:1">

  if (!raw) return defaultState();
  try {
    const s = Object.assign(defaultState(), JSON.parse(raw));
    if (!s.equipped) s.equipped = defaultState().equipped;
    if (!Array.isArray(s.ownedItems)) s.ownedItems = [];
    return s;
  } catch { return defaultState(); }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();
let deck = [];
let idx = 0;
let correctThisSession = 0;
let answered = false;

const view = document.getElementById("view");
const streakEl = document.getElementById("streak");
const statsEl = document.getElementById("stats");
const counterEl = document.getElementById("counter");
const coinsEl = document.getElementById("coins");
const barEl = document.getElementById("bar");
const catStage = document.getElementById("catStage");
const catBubble = document.getElementById("catBubble");
let bubbleTimeout = null;

const FRASI_GIUSTO = ["Miao! Perfetto 🐾", "Bravo! 🎉", "Miao miao! 😻", "Ottimo lavoro!", "Ci sei! 🐱", "Sììì! 🎊"];
const FRASI_SBAGLIATO = ["Miao… quasi 😿", "Riprovaci! 🐾", "Oops, sbagliato!", "Mrrp… 😾", "Non ci siamo 😿", "La prossima va meglio!"];
const FRASI_FINE = ["Miao! Lezione finita! 🎉", "Bravissimo! 🐱🎊", "Ce l'hai fatta! 😻", "Miao miao miao! 🎉"];

function setCatMood(mood) {
  catStage.classList.remove("cat-idle", "cat-happy", "cat-sad", "cat-celebrate");
  catStage.classList.add("cat-" + mood);
}
function showBubble(text, duration = 2000) {
  catBubble.textContent = text;
  catBubble.classList.add("show");
  clearTimeout(bubbleTimeout);
  bubbleTimeout = setTimeout(() => catBubble.classList.remove("show"), duration);
}
function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function catWander() {
  const dx = (Math.random() - 0.5) * 60;
  const dy = (Math.random() - 0.5) * 40;
  catStage.style.transform = `translate(${dx}px, ${dy}px)`;
}

function applyCosmetics() {
  const e = state.equipped;
  const root = document.documentElement;

  // 1. Applica Tema
  if (e.theme === "theme-dark" || !e.theme) {
    root.style.setProperty('--bg', '#131f24');
    root.style.setProperty('--card', '#1f2f38');
    root.style.setProperty('--border', '#2b3d47');
    root.style.setProperty('--text', '#f1f7fb');
  } else if (e.theme === "theme-blue") {
    root.style.setProperty('--bg', '#0f172a');
    root.style.setProperty('--card', '#1e293b');
    root.style.setProperty('--border', '#334155');
    root.style.setProperty('--text', '#f8fafc');
  } else if (e.theme === "theme-green") {
    root.style.setProperty('--bg', '#142b1e');
    root.style.setProperty('--card', '#1e3a2a');
    root.style.setProperty('--border', '#2e503d');
    root.style.setProperty('--text', '#f0fdf4');
  } else if (e.theme === "theme-purple") {
    root.style.setProperty('--bg', '#1f1333');
    root.style.setProperty('--card', '#2e1d4a');
    root.style.setProperty('--border', '#432e66');
    root.style.setProperty('--text', '#faf5ff');
  } else if (e.theme === "theme-light") {
    root.style.setProperty('--bg', '#f1f5f9');
    root.style.setProperty('--card', '#ffffff');
    root.style.setProperty('--border', '#cbd5e1');
    root.style.setProperty('--text', '#0f172a');
  }

  // 2. Applica Decorazioni Sfondo
  document.querySelectorAll(".deco").forEach(d => { d.style.display = "none"; d.textContent = ""; });
  const decoMap = {
    "deco-stars": ["✨","⭐","✨"],
    "deco-hearts": ["💖","💗","💕"],
    "deco-paws": ["🐾","🐾","🐾"]
  };
  if (e.deco && decoMap[e.deco]) {
    const [tl, tr, bl] = decoMap[e.deco];
    document.getElementById("decoTL").textContent = tl;
    document.getElementById("decoTR").textContent = tr;
    document.getElementById("decoBL").textContent = bl;
    ["decoTL","decoTR","decoBL"].forEach(id => document.getElementById(id).style.display = "block");
  }
}

function renderHeader() {
  streakEl.textContent = `🔥 ${state.streak} ${state.streak === 1 ? "giorno" : "giorni"}`;
  statsEl.textContent = `${state.totalCorrect} risposte corrette`;
  coinsEl.textContent = `🪙 ${state.coins}`;
}
function renderProgress() {
  const pct = deck.length ? (idx / deck.length) * 100 : 0;
  barEl.style.width = pct + "%";
  counterEl.textContent = deck.length ? `${idx} / ${deck.length}` : "";
}

function today() { return new Date().toISOString().slice(0,10); }
function refreshDailyLimit() {
  const t = today();
  if (state.lessonsDay !== t) { state.lessonsDay = t; state.lessonsToday = 0; saveState(); }
}
function lessonsRemaining() { refreshDailyLimit(); return Math.max(0, LESSONS_PER_DAY - state.lessonsToday); }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function updateStreakOnStart() {
  const t = today();
  if (state.lastPlayed === t) return;
  if (state.lastPlayed) {
    const last = new Date(state.lastPlayed);
    const now = new Date(t);
    const diff = Math.round((now - last) / (1000*60*60*24));
    if (diff === 1) state.streak += 1;
    else if (diff > 1) state.streak = 1;
  } else state.streak = 1;
  state.lastPlayed = t;
  saveState();
  streakEl.classList.add("bump");
  setTimeout(() => streakEl.classList.remove("bump"), 400);
}

function buildLesson() {
  const seenSet = new Set(state.seenQuestions);
  const unseen = [], seen = [];
  QUESTIONS.forEach((q, i) => { (seenSet.has(i) ? seen : unseen).push(i); });
  const pool = shuffle(unseen).concat(shuffle(seen));
  const chosen = pool.slice(0, Math.min(QUESTIONS_PER_LESSON, pool.length));
  chosen.forEach(i => { if (!state.seenQuestions.includes(i)) state.seenQuestions.push(i); });
  saveState();
  if (state.seenQuestions.length >= QUESTIONS.length) { state.seenQuestions = []; saveState(); }
  deck = chosen.map(i => {
    const q = QUESTIONS[i];
    const correctText = q.a[q.correct];
    const shuffled = shuffle([...q.a]);
    return { cat:q.cat, q:q.q, a:shuffled, correct:shuffled.indexOf(correctText), why:q.why };
  });
}

function renderMenu() {
  refreshDailyLimit();
  renderHeader();
  applyCosmetics();
  barEl.style.width = "0%";
  counterEl.textContent = "";
  setCatMood("idle");
  showBubble("Ciao! Pronto per giocare? 🐱", 2500);

  const remaining = lessonsRemaining();
  const canPlay = remaining > 0;
  const counts = {};
  QUESTIONS.forEach(q => { counts[q.cat] = (counts[q.cat] || 0) + 1; });
  const catRows = Object.entries(counts)
    .map(([c,n]) => `<div class="cat-row"><span>${c}</span><span>${n}</span></div>`)
    .join("");

  view.innerHTML = `
    <div class="menu-title">Ciao! 👋</div>
    <div class="menu-sub">Pronto per la tua lezione quotidiana?</div>
    <div class="card">
      <div class="lesson-info">
        <span>Lezioni oggi: <b>${state.lessonsToday} / ${LESSONS_PER_DAY}</b></span>
        <span>${remaining > 0 ? `${remaining} rimaste` : "Limite raggiunto"}</span>
      </div>
      ${canPlay
        ? `<button class="btn" id="startBtn">Inizia lezione</button>`
        : `<div class="limit-box"><h3>Hai finito per oggi 🌙</h3><p>Torna domani per altre ${LESSONS_PER_DAY} lezioni. Lo streak ti aspetta!</p></div>`
      }
    </div>
    <button class="btn gold" id="shopBtn">🛍️ Apri lo Shop (🪙 ${state.coins})</button>
    <div class="card">
      <div class="category">Categorie disponibili</div>
      ${catRows}
    </div>
    <button class="btn secondary" id="resetBtn">Azzera progressi</button>
  `;

  if (canPlay) document.getElementById("startBtn").addEventListener("click", startLesson);
  document.getElementById("shopBtn").addEventListener("click", renderShop);
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Vuoi davvero azzerare TUTTI i progressi, monete e acquisti?")) {
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      saveState();
      renderMenu();
    }
  });
}

function renderShop() {
  renderHeader();
  barEl.style.width = "0%";
  counterEl.textContent = "";
  setCatMood("idle");
  showBubble("Benvenuto nello shop! 🛍️", 2000);

  const groups = [
    { title:"🎨 Temi Colore",  type:"theme" },
    { title:"✨ Decorazioni",  type:"deco" },
  ];

  const sectionsHtml = groups.map(g => {
    const items = SHOP_ITEMS.filter(i => i.type === g.type);
    if (!items.length) return "";
    const rows = items.map(item => {
      const owned = state.ownedItems.includes(item.id) || item.price === 0;
      const equipped = state.equipped[item.type] === item.id;
      let btnClass = "shop-buy";
      let btnLabel = `${item.price} 🪙`;
      let disabled = false;
      
      if (equipped) { btnClass += " equipped"; btnLabel = "✓ Attivo"; disabled = true; }
      else if (owned) { btnClass += " owned"; btnLabel = "Attiva"; }
      else if (state.coins < item.price) { disabled = true; }
      
      return `
        <div class="shop-item">
          <div class="shop-item-info">
            <div class="shop-item-emoji">${item.emoji}</div>
            <div>
              <div class="shop-item-name">${item.name}</div>
              <div class="shop-item-desc">${item.desc}</div>
            </div>
          </div>
          <button class="${btnClass}" data-id="${item.id}" ${disabled ? "disabled" : ""}>${btnLabel}</button>
        </div>
      `;
    }).join("");
    return `<div class="shop-section-title">${g.title}</div>${rows}`;
  }).join("");

  view.innerHTML = `
    <div class="menu-title">🛍️ Shop</div>
    <div class="menu-sub">Monete disponibili: <b style="color:var(--gold)">🪙 ${state.coins}</b></div>
    <div class="card">${sectionsHtml}</div>
    <button class="btn secondary" id="backBtn">← Torna al menu</button>
  `;

  document.querySelectorAll(".shop-buy").forEach(btn => {
    btn.addEventListener("click", () => buyOrEquip(btn.dataset.id));
  });
  document.getElementById("backBtn").addEventListener("click", renderMenu);
}

function buyOrEquip(id) {
  const item = SHOP_ITEMS.find(i => i.id === id);
  if (!item) return;
  
  const owned = state.ownedItems.includes(id) || item.price === 0;
  const equipped = state.equipped[item.type] === id;
  
  if (equipped) return;

  // Se lo possiede, lo equipaggia
  if (owned) {
    state.equipped[item.type] = id;
    saveState();
    applyCosmetics();
    showBubble(`Attivato: ${item.name}! ✨`, 1500);
    setCatMood("happy");
    setTimeout(() => setCatMood("idle"), 800);
    renderShop();
    return;
  }

  // Se non lo possiede, controlla monete
  if (state.coins < item.price) {
    showBubble("Non hai abbastanza monete! 😿", 1500);
    setCatMood("sad");
    setTimeout(() => setCatMood("idle"), 800);
    return;
  }

  // Compra
  state.coins -= item.price;
  state.ownedItems.push(id);
  state.equipped[item.type] = id;
  saveState();
  applyCosmetics();
  renderHeader();
  showBubble(`Comprato: ${item.name}! 🎉`, 1800);
  setCatMood("happy");
  setTimeout(() => setCatMood("idle"), 800);
  renderShop();
}

function startLesson() {
  if (lessonsRemaining() <= 0) return;
  updateStreakOnStart();
  buildLesson();
  idx = 0;
  correctThisSession = 0;
  setCatMood("idle");
  showBubble("Si comincia! 🐾", 1500);
  renderQuestion();
}

function renderQuestion() {
  if (idx >= deck.length) return renderLessonDone();
  const q = deck[idx];
  answered = false;
  renderProgress();
  view.innerHTML = `
    <div class="card">
      <div class="category">${q.cat}</div>
      <div class="question">${q.q}</div>
      <div class="answers">
        ${q.a.map((ans,i) => `<button class="answer" data-i="${i}">${ans}</button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="btn hidden" id="nextBtn">Continua</button>
    </div>
  `;
  document.querySelectorAll(".answer").forEach(btn => {
    btn.addEventListener("click", () => handleAnswer(parseInt(btn.dataset.i), q));
  });
  document.getElementById("nextBtn").addEventListener("click", () => { idx++; renderQuestion(); });
}

function handleAnswer(selected, q) {
  if (answered) return;
  answered = true;
  const isCorrect = selected === q.correct;
  document.querySelectorAll(".answer").forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add("correct");
    else if (i === selected) btn.classList.add("wrong");
  });
  const fb = document.getElementById("feedback");
  fb.className = "feedback show " + (isCorrect ? "ok" : "no");
  fb.textContent = (isCorrect ? "✅ Giusto! " : "❌ Sbagliato. ") + q.why;

  state.totalAnswers += 1;
  if (isCorrect) {
    state.totalCorrect += 1;
    correctThisSession += 1;
    state.coins += COINS_PER_CORRECT;
    showCoinGain(COINS_PER_CORRECT);
  }
  saveState();
  renderHeader();

  if (isCorrect) {
    setCatMood("happy");
    showBubble(randomFrom(FRASI_GIUSTO) + ` +${COINS_PER_CORRECT}🪙`, 1800);
    setTimeout(() => setCatMood("idle"), 800);
    catWander();
  } else {
    setCatMood("sad");
    showBubble(randomFrom(FRASI_SBAGLIATO), 1800);
    setTimeout(() => setCatMood("idle"), 800);
  }

  const nextBtn = document.getElementById("nextBtn");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = idx === deck.length - 1 ? "Termina lezione" : "Continua";
}

function showCoinGain(amount) {
  const el = document.createElement("div");
  el.textContent = `+${amount} 🪙`;
  el.style.cssText = `
    position: fixed; right: 130px; bottom: 150px; z-index: 200;
    color: var(--gold); font-weight: 800; font-size: 18px;
    pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,.5);
    animation: coinFloat 1s ease forwards;
  `;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
  if (!document.getElementById("coinAnimStyle")) {
    const style = document.createElement("style");
    style.id = "coinAnimStyle";
    style.textContent = `@keyframes coinFloat {
      0%   { opacity: 0; transform: translateY(0) scale(.8); }
      20%  { opacity: 1; transform: translateY(-10px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1); }
    }`;
    document.head.appendChild(style);
  }
}

function renderLessonDone() {
  refreshDailyLimit();
  state.lessonsToday += 1;
  state.coins += COINS_LESSON_BONUS;
  saveState();
  renderHeader();

  barEl.style.width = "100%";
  counterEl.textContent = `${deck.length} / ${deck.length}`;
  setCatMood("celebrate");
  showBubble(randomFrom(FRASI_FINE) + ` +${COINS_LESSON_BONUS}🪙 bonus!`, 3000);

  const remaining = lessonsRemaining();
  const earned = correctThisSession * COINS_PER_CORRECT + COINS_LESSON_BONUS;
  view.innerHTML = `
    <div class="card done">
      <h2>Lezione completata! 🎉</h2>
      <p>Hai risposto correttamente a ${correctThisSession} domande su ${deck.length}.</p>
      <p style="font-size:16px;color:var(--gold);font-weight:700">+${earned} 🪙 guadagnate!</p>
      <p style="font-size:13px">Lezioni rimaste oggi: ${remaining}</p>
      <button class="btn" id="shopBtn2">🛍️ Vai allo Shop</button>
      <button class="btn secondary" id="menuBtn">Torna al menu</button>
    </div>
  `;
  document.getElementById("shopBtn2").addEventListener("click", renderShop);
  document.getElementById("menuBtn").addEventListener("click", () => {
    setCatMood("idle");
    renderMenu();
  });
  launchConfetti();
}

function launchConfetti() {
  const colors = ["#58cc02","#ff9600","#ff4b4b","#1cb0f6","#ce82ff","#ffd700"];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.2 + Math.random() * 1.2) + "s";
    c.style.animationDelay = (Math.random() * 0.3) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

try {
  refreshDailyLimit();
  renderMenu();
} catch (e) {
  console.error("Errore avvio:", e);
  document.getElementById("view").innerHTML =
    '<div class="card"><h2 style="color:#ff4b4b">Errore di caricamento</h2><p>Apri la console (F12) per i dettagli.</p><p style="font-size:12px;color:#8fa6b2">' + e.message + '</p></div>';
}
</script>
</body>
</html>
